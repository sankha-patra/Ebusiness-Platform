server:
  port: 8082

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ebusiness
    username: ebusiness_user
    password: ebusiness_pass
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: >-
          paymentConfirmed:com.ebusiness.order.event.PaymentConfirmedEvent,
          orderStatus:com.ebusiness.order.event.OrderStatusChangeEvent,
          com.ebusiness.payment.event.PaymentConfirmedEvent:com.ebusiness.order.event.PaymentConfirmedEvent,
          com.ebusiness.platform.event.PaymentConfirmedEvent:com.ebusiness.order.event.PaymentConfirmedEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: >-
          paymentConfirmed:com.ebusiness.order.event.PaymentConfirmedEvent,
          orderStatus:com.ebusiness.order.event.OrderStatusChangeEvent

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.ebusiness.order: INFO
