spring:
  application:
    name: ebusiness-platform
  
  # Local PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/ebusiness
    username: ebusiness_user
    password: ebusiness_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  
  # Redis Configuration (Free tier - can be local or cloud)
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 1500ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 500ms
  
  # Cache Configuration
  cache:
    type: redis
  
  # Kafka Configuration (Local Docker)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ebusiness-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.ebusiness.platform.*
        max.poll.records: 10
        fetch.min.bytes: 1
        fetch.max.wait.ms: 500
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        linger.ms: 100
        batch.size: 1024
        acks: 1

# Razorpay Configuration (Test Mode - Real Test Keys)
razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_TKP6V8tEkHHnxe}
  key-secret: ${RAZORPAY_KEY_SECRET:jLyQKMLONsjECH2Jufg4JRgz}
  currency: INR
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:webhook_secret}

# Server Configuration
server:
  port: 8081
  error:
    include-message: always
    include-binding-errors: always

# Logging Configuration
logging:
  level:
    com.ebusiness.platform: DEBUG
    org.springframework.cache: DEBUG
    org.springframework.kafka: INFO
    io.github.resilience4j: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Resilience4j Configuration (Tuned for low traffic simulation)
resilience4j:
  circuitbreaker:
    instances:
      razorpayApi:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 60
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - java.lang.RuntimeException
          - com.razorpay.RazorpayException
          - java.net.ConnectException
  retry:
    instances:
      razorpayApi:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.net.ConnectException
          - java.util.concurrent.TimeoutException

kafka:
  enabled: true

# Disable Redis health check so app stays UP when Redis is down
management:
  health:
    redis:
      enabled: false
