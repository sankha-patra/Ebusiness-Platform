spring:
  profiles:
    active: freetier
  application:
    name: ebusiness-platform
  
  # PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/ebusiness
    username: ebusiness_user
    password: ebusiness_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  
  # Redis Configuration
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: 1500ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 500ms
  
  # Cache Configuration
  cache:
    type: redis
  
  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ebusiness-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.ebusiness.platform.*
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# Razorpay Configuration
razorpay:
  key-id: ${RAZORPAY_KEY_ID:your_key_id}
  key-secret: ${RAZORPAY_KEY_SECRET:your_key_secret}
  currency: INR
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:your_webhook_secret}

# Server Configuration
server:
  port: 8081
  error:
    include-message: always
    include-binding-errors: always

# Logging Configuration
logging:
  level:
    com.ebusiness.platform: DEBUG
    org.springframework.cache: DEBUG
    org.springframework.kafka: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      razorpayApi:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
  retry:
    instances:
      razorpayApi:
        max-attempts: 3
        wait-duration: 1s

kafka:
  enabled: true
