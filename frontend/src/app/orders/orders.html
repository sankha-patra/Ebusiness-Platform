<mat-card class="page-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>Orders</mat-card-title>
    <mat-card-subtitle>All orders with pagination</mat-card-subtitle>
  </mat-card-header>

  <mat-card-actions align="end">
    <button mat-stroked-button type="button" (click)="loadOrders()" [disabled]="loading()">Refresh</button>
  </mat-card-actions>

  <mat-progress-bar *ngIf="loading()" mode="indeterminate"></mat-progress-bar>

  <mat-card-content>
    <p class="error" *ngIf="error()">{{ error() }}</p>

    <div class="table-wrap" *ngIf="!error()">
      <table mat-table [dataSource]="orders()" class="mat-elevation-z0 full-width">
        <ng-container matColumnDef="orderId">
          <th mat-header-cell *matHeaderCellDef>Order</th>
          <td mat-cell *matCellDef="let row">{{ row.orderId }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let row"><span class="status-pill">{{ row.status }}</span></td>
        </ng-container>

        <ng-container matColumnDef="paymentStatus">
          <th mat-header-cell *matHeaderCellDef>Payment</th>
          <td mat-cell *matCellDef="let row">{{ row.paymentStatus }}</td>
        </ng-container>

        <ng-container matColumnDef="totalAmount">
          <th mat-header-cell *matHeaderCellDef>Amount</th>
          <td mat-cell *matCellDef="let row">{{ row.currency }} {{ row.totalAmount }}</td>
        </ng-container>

        <ng-container matColumnDef="razorpayOrderId">
          <th mat-header-cell *matHeaderCellDef>Razorpay</th>
          <td mat-cell *matCellDef="let row" class="mono">{{ row.razorpayOrderId || '-' }}</td>
        </ng-container>

        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef>Created</th>
          <td mat-cell *matCellDef="let row">{{ row.createdAt | date:'short' }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <p *ngIf="!loading() && orders().length === 0" class="empty">No orders yet.</p>

      <mat-paginator
        [length]="totalElements()"
        [pageIndex]="page()"
        [pageSize]="size()"
        [pageSizeOptions]="[5, 10, 20]"
        (page)="onPage($event)"
      ></mat-paginator>
    </div>
  </mat-card-content>
</mat-card>
