services:
  # PostgreSQL Database (Free tier compatible)
  postgres:
    image: postgres:15-alpine
    container_name: ebusiness-postgres
    environment:
      POSTGRES_DB: ebusiness
      POSTGRES_USER: ebusiness_user
      POSTGRES_PASSWORD: ebusiness_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebusiness_user -d ebusiness"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Redis Cache (Free tier - single instance)
  redis:
    image: redis:7-alpine
    container_name: ebusiness-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Kafka with Zookeeper (Free tier - single broker)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ebusiness-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_HEAP_KB: 256000
    ports:
      - "2181:2181"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ebusiness-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_HEAP_KB: 512000
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Kafka UI — port 8088 so API Gateway can own 8080
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ebusiness-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # ===================== APPLICATION SERVICES =====================

  # Monolith (owns DB schema + notifications). Schema owner: starts first.
  backend:
    build: ./backend
    container_name: ebusiness-backend
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: freetier
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ebusiness
      SPRING_DATASOURCE_USERNAME: ebusiness_user
      SPRING_DATASOURCE_PASSWORD: ebusiness_pass
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_TKP6V8tEkHHnxe}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-jLyQKMLONsjECH2Jufg4JRgz}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-webhook_secret}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 640M

  product-service:
    build: ./product-service
    container_name: ebusiness-product-service
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ebusiness
      SPRING_DATASOURCE_USERNAME: ebusiness_user
      SPRING_DATASOURCE_PASSWORD: ebusiness_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

  order-service:
    build: ./order-service
    container_name: ebusiness-order-service
    depends_on:
      backend:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ebusiness
      SPRING_DATASOURCE_USERNAME: ebusiness_user
      SPRING_DATASOURCE_PASSWORD: ebusiness_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      KAFKA_BOOTSTRAP: kafka:29092
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

  payment-service:
    build: ./payment-service
    container_name: ebusiness-payment-service
    depends_on:
      backend:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ebusiness
      SPRING_DATASOURCE_USERNAME: ebusiness_user
      SPRING_DATASOURCE_PASSWORD: ebusiness_pass
      KAFKA_BOOTSTRAP: kafka:29092
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_TKP6V8tEkHHnxe}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-jLyQKMLONsjECH2Jufg4JRgz}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-webhook_secret}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

  api-gateway:
    build: ./api-gateway
    container_name: ebusiness-api-gateway
    depends_on:
      backend:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    environment:
      PRODUCT_SERVICE_URI: http://product-service:8083
      ORDER_SERVICE_URI: http://order-service:8082
      PAYMENT_SERVICE_URI: http://payment-service:8084
      MONOLITH_URI: http://backend:8081
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 384M

  frontend:
    build: ./frontend
    container_name: ebusiness-frontend
    depends_on:
      - api-gateway
    ports:
      - "4200:80"
    deploy:
      resources:
        limits:
          memory: 128M

  # Idempotent demo catalog + sample orders (safe on every up)
  seed:
    image: postgres:15-alpine
    container_name: ebusiness-seed
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PGPASSWORD: ebusiness_pass
    volumes:
      - ./scripts/seed-demo-data.sql:/seed.sql:ro
    entrypoint: ["psql", "-h", "postgres", "-U", "ebusiness_user", "-d", "ebusiness", "-f", "/seed.sql"]
    restart: "no"

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: ebusiness-network
